# === stand/docker-compose.gui.yml ===
# GUI стенд xswitcher с noVNC для тестирования физического ввода через xdotool.
#
# Запуск:
#   cd stand && docker compose -f docker-compose.gui.yml up --build
#
# Доступ: http://host.docker.internal:${NOVNC_PORT}/noVNC/

services:
  # Стенд — всё в одном контейнере (builder образ)
  xswitcher-stand:
    build: ./Dockerfile.gui
    ports:
      - "${NOVNC_PORT:-6081}:3001"   # noVNC WebSockets через websockify
      - "5900:5900/tcp"                # VNC порт для прямой связи
    volumes:
      # Гостевая папка с исходниками (только чтение).
      - ../:/w:ro
      # Кэш модулей Go на хосте, чтобы не качать каждый раз.
      - ../.gomodcache:/root/go/pkg/mod:cached
    environment:
      - LC_ALL=C
      - XSWITCHER_LANG=en
      - DUMPLOG=1
      - XSWITCHER_HOTKEY="ctrl+alt+s"  # свой hotkey для стенда
    privileged: true
    stdin_open: true
    tty: true
