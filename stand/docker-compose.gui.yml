# === stand/docker-compose.gui.yml ===
# GUI стенд xswitcher с noVNC для тестирования физического ввода через xdotool.
#
# Архитектура:
#   — Dockerfile.gui в двух этапах компилирует daemon+GUI и собирает тонкий образ
#     со Xvfb + websockify + noVNC-сервером + демоном xswitcher-gui
#   — noVNC клиент доступен на порту 6081/tcp (websockify proxy'ит к VNC)
#
# Запуск:
#   cd stand && docker compose -f docker-compose.gui.yml up --build

services:
  # Стенд — всё в одном контейнере. Образ собирается из Dockerfile.gui.
  xswitcher-stand:
    build:
      context: .            # контекст сборки = корень stand/
      dockerfile: Dockerfile.gui   # путь внутри контекста (stand/Dockerfile.gui)
    container_name: xswitcher-gui-stand
    ports:
      - "6081:6081/tcp"   # noVNC WebSocket (websockify → VNC :5900)
      - "5900:5900/tcp"   # прямой VNC доступ (для отладки)
    volumes:
      - ./xswitcher-stand.conf:/conf/xswitcher-stand.conf:ro
    environment:
      - LC_ALL=C
      - XSWITCHER_LANG=en
      - DUMPLOG=1
      - HOTKEY=${XSWITCHER_HOTKEY:-ctrl+alt+s}  # hotkey для стенда (передается в образ)
      - NOVNC_VERSION=2.1.15                     # версия noVNC в Dockerfile.gui
    privileged: true
    stdin_open: true
    tty: true
