# xswitcher — стенд для тестирования GUI
# hotkey берётся из env HOTKEY, дефолт: ctrl+alt+s

[Daemon]
Respawn = -1
Exec    = /w/bin/xswitcher-gui

[ScanDevices]
Test = "/dev/input/event0"

Keys.Hotkey   = ${HOTKEY:-ctrl+alt+s}

[Action.RetypeWord]
Actions = [Action.Wipe, Action.Switch, Action.Restore]

[Action.Wipe]
Exec    = /bin/echo "BACKSPACE" >"$TSV"

[Action.Switch]
Layouts = [0]

[Action.Restore]
Exec    = /bin/echo "RETYPE" >"$TSV"
